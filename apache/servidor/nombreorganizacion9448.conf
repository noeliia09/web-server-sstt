<VirtualHost *:80>
	ServerAdmin admin@nombreorganizacion9448.org
	ServerName www.nombreorganizacion9448.org
	DocumentRoot /var/www/nombreorganizacion9448
	<Directory /var/www/nombreorganizacion9448>
		AllowOverride AuthConfig
		AuthType Basic
		AuthName "Acceso restringido al grupo administradores"
		AuthBasicProvider file
		AuthUserFile /etc/apache2/passwords
		AuthGroupFile /etc/apache2/groups
		Require group administradores
		Order allow,deny
		allow from all
	</Directory>
</VirtualHost>
<VirtualHost *:443>
        ServerAdmin admin@nombreorganizacion9448.org
        ServerName www.nombreorganizacion9448.org
        DocumentRoot /var/www/nombreorganizacion9448
        <Directory /var/www/nombreorganizacion9448>
		AllowOverride None
		Order allow,deny
                allow from all
        </Directory>
	SSLEngine on
	SSLCertificateFile /home/vboxuser/demoCA/servercert.pem
	SSLCertificateKeyFile /home/vboxuser/demoCA/serverkey.pem
	SSLCACertificateFile /home/vboxuser/demoCA/cacert.pem
</VirtualHost>
